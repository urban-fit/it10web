<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        body {
            background-image: url(mountain.jpg);
            font-family: tahoma;
            background-size: cover;
            min-height: 100vh;
            background-position: center;
        }

        .box {
            background-color: white;
            border: 1px solid gray;
            border-radius: 25px;
            margin: 20px;
            padding: 20px;
            width: 90%;
            height: 200px;
        }

        input {
            width: 180px;
            padding: 5px;
        }

        button {
            padding: 5px;
        }
    </style>

</head>

<body>

    <div class="box">
        <h3 style="color: blue;">Login</h3>

        <form>
            Username <br>
            <input type="text"> <br><br>

            Password <br>
            <input type="password">
            <button>Login</button>
        </form>
    </div>

</body>

</html>
