<html>
<head>
    <title>Create an Internet Mail Account</title>
</head>
<body>

    <h2>Create a Internet Mail Account</h2>

    <form>
        First Name <input type="text" name="firstname"><br><br>
        
        Last Name <input type="text" name="lastname"><br><br>
        
        Desired Login Name <input type="text" name="login"> @mail.com<br><br>
        
        Password <input type="password" name="pwd"><br><br>
        
        <input type="radio" name="gender" value="male"> Male<br>
        <input type="radio" name="gender" value="female"> Female<br><br>
        
        Birthday <input type="text" name="bday"> 
        <select>
            <option>-Select One-</option>
        </select><br><br>
        
        TypeYourself<br>
        <textarea rows="4" cols="25"></textarea><br><br>
        
        <input type="submit" value="Accept">
        <input type="button" value="Cancel">
    </form>

</body>
</html>
